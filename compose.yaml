# ==============================================================================
# Docker Compose 조립 및 실행 설명서 (compose.yaml)
#
# [역할]
# 이 파일은 내 컴퓨터에 백엔드 서버(FastAPI)와 데이터베이스(MySQL) 2개의 도커 컨테이너를
# 한 번에 묶어서 올바른 순서대로 실행해주는 오케스트라 지휘자 역할을 합니다.
#
# [주요 서비스 및 포트]
# 1. api   : 백엔드 FastAPI 서버 (포트 8000 -> http://localhost:8000)
# 2. mysql : MySQL 8.4 데이터베이스 (포트 3306 -> 내 컴퓨터 하드에 데이터 보존)
#
# [주요 실행 명령어]
# - 서버 & DB 실행 (빌드 포함) : docker compose up --build
# - 백그라운드(배경) 실행     : docker compose up -d
# - 서버 종료                  : docker compose down
# - 서버 종료 & DB 데이터 초기화: docker compose down -v
# ==============================================================================

services:
  api:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      # 아래 값은 .env와 일치해야 합니다. 로컬 전용이며 운영 비밀번호가 아닙니다.
      MYSQL_DATABASE: ${DB_NAME:-hanium}
      MYSQL_USER: ${DB_USER:-hanium}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_LOCAL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_LOCAL_ROOT_PASSWORD}
    ports:
      # DB 도구에서 접속할 때만 필요합니다. 외부 공개 서버에서는 이 포트를 열지 않습니다.
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql # mysql 컨테이너 안에서 발생하는 모든 데이터를 하드에 동기화
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:

